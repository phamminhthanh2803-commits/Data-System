# Market PM — transmission, khoi ngoai/tu doanh, ICB, tv-history, dinh gia khu vuc, MSCI
# Gio VN = UTC + 7. Chay tay: Actions -> Market PM -> Run workflow -> only=a,b (vi du icb-vci) de chay 1 buoc.
name: Market PM

on:
  schedule:
    - cron: "30 11 * * *"            # 18:30 gio VN
  workflow_dispatch:
    inputs:
      only:
        description: "Chi chay cac buoc nay, cach nhau boi dau phay (de trong = ca slot). Vi du: icb-vci"
        required: false
        default: ""
        type: string

concurrency:
  group: pipeline               # 2 slot khong chay de nhau (cung Drive); job sau doi job truoc xong
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  VNSTOCK_DISABLE_AGENT_SETUP: "1"
  CLOUD: "1"
  CLOUD_SKIP: cvhcm,cvhcm-berthmap,nganh-ck,bonds     # 4 buoc nay chay o laptop (IP VN / Excel COM / bond 3,5 GB)
  REGION_SKIP: idx,bursa                              # valuation-region: IDX + Bursa Cloudflare chan IP My -> laptop
  MD_ROOT: ${{ github.workspace }}/market-data
  SHIP_ROOT: ${{ github.workspace }}/shipping
  BCTC_ROOT: ${{ github.workspace }}/bctc
  HAH_DIR: ${{ github.workspace }}/hah
  TESSERACT_CMD: tesseract
  TESSDATA_PREFIX: /usr/share/tesseract-ocr/5/tessdata
  RCLONE_REMOTE: gdrive:pipeline-data
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  ONLY: ${{ inputs.only }}

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Python 3.12 (cache pip)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: market-data/requirements.txt

      - name: Cai thu vien Python
        run: |
          python -m pip install --upgrade pip
          pip install -r market-data/requirements.txt

      - name: Cai Tesseract (OCR tieng Viet) + rclone
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq tesseract-ocr tesseract-ocr-vie
          curl -fsSL https://rclone.org/install.sh | sudo bash
          rclone version

      - name: Cau hinh rclone tu secret RCLONE_CONF (base64)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::error::Thieu secret RCLONE_CONF"; exit 1; fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd "$RCLONE_REMOTE" > /dev/null

      - name: Keo du lieu tu Drive (chi thu muc slot can)
        id: down
        run: python sync_data.py down --hub market-data --slot PM --only "$ONLY"

      - name: Chay pipeline market-data PM
        run: python market-data/run_slot.py --slot PM --only "$ONLY"

      - name: Day du lieu len Drive (ke ca khi pipeline loi, NHUNG chi khi da keo xuong OK)
        if: always() && steps.down.outcome == 'success'
        run: python sync_data.py up --hub market-data --slot PM --only "$ONLY"

      - name: Trang thai
        if: always()
        run: |
          echo "## Market PM" >> "$GITHUB_STEP_SUMMARY"
          cat market-data/status-PM.txt >> "$GITHUB_STEP_SUMMARY" 2>/dev/null || echo "(khong co status)" >> "$GITHUB_STEP_SUMMARY"
          grep -E "FAIL|STALE|WARN" market-data/status-PM.txt && echo "::warning::Market PM: $(cat market-data/status-PM.txt)" || true

      - name: Luu log + status (artifact 30 ngay)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: market-PM-${{ github.run_id }}
          path: |
            market-data/logs/*.log
            market-data/status-PM.txt
          if-no-files-found: warn
          retention-days: 30
