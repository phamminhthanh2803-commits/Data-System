name: Probe nguon du lieu tu runner GitHub

on:
  workflow_dispatch:
  schedule:
    - cron: "30 3 * * 1"    # thu Hai 10:30 gio VN

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cai thu vien
        run: pip install requests curl_cffi
      - name: Chay probe
        run: |
          cd cloud-probe
          python probe_cloud.py --json probe_github_$(date +%Y%m%d).json | tee probe_output.txt
      - name: Tom tat
        if: always()
        run: |
          echo '### Ket qua probe tu runner GitHub' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat cloud-probe/probe_output.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
      - name: Luu ket qua
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: probe-github
          path: |
            cloud-probe/probe_output.txt
            cloud-probe/probe_github_*.json
