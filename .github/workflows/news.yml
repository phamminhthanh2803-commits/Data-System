# News RSS — keo tin 57 chuyen muc RSS cua 11 bao kinh te + phan loai theo nganh (market-data/news-rss/fetch_rss.py), 11/11/2026.
# RSS chi giu 20-100 bai moi nhat moi chuyen muc (Vietstock 20) -> chay 2 GIO/LAN tu 06:15 den 22:15 gio VN de khong sot tin.
# Du lieu: gdrive:pipeline-data/market-data/news-rss/data (news_master/tagged/tags parquet ~3 MB) -> app tab Tin tuc › Tin theo nganh
# (cloud_boot keo moi 30 phut; laptop: sync_data.py app). Chi workflow nay ghi thu muc do (khong co buoc news trong Market AM/PM).
# Gio VN = UTC + 7. Chay tay: Actions -> News RSS -> Run workflow (reclass = phan loai lai toan bo sau khi sua tu dien).
name: News RSS

on:
  schedule:
    - cron: "15 23,1,3,5,7,9,11,13,15 * * *"     # 06:15 08:15 ... 22:15 gio VN
  workflow_dispatch:
    inputs:
      reclass:
        description: "Phan loai lai toan bo lich su (sau khi sua config/keywords.csv)"
        required: false
        default: false
        type: boolean

concurrency:
  group: news-rss                 # khong 2 lan chay cung ghi Drive (lan sau doi lan truoc)
  cancel-in-progress: false

env:
  TZ: Asia/Ho_Chi_Minh
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  RCLONE_REMOTE: gdrive:pipeline-data
  NEWS_DIR: market-data/news-rss/data

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Lay code
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cai thu vien Python (toi thieu)
        run: |
          python -m pip install --upgrade pip
          pip install pandas==2.3.3 pyarrow==24.0.0 lxml==6.1.3 curl_cffi==0.15.0 requests==2.34.2 RapidFuzz==3.14.5

      - name: Cai rclone
        run: |
          bash ci/install_rclone.sh
          rclone version

      - name: Cau hinh rclone tu secret RCLONE_CONF (base64)
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::error::Thieu secret RCLONE_CONF"; exit 1; fi
          mkdir -p ~/.config/rclone
          echo "$RCLONE_CONF" | base64 -d > ~/.config/rclone/rclone.conf
          chmod 600 ~/.config/rclone/rclone.conf
          rclone lsd "$RCLONE_REMOTE" > /dev/null

      - name: Keo kho tin hien hanh + bang ICB tu Drive
        id: down
        run: |
          mkdir -p "$NEWS_DIR" market-data/index-fetcher/raw
          rclone copy "$RCLONE_REMOTE/market-data/news-rss/data" "$NEWS_DIR" --transfers 8
          rclone copyto "$RCLONE_REMOTE/market-data/index-fetcher/raw/vn_icb_vci.csv" market-data/index-fetcher/raw/vn_icb_vci.csv
          ls -la "$NEWS_DIR"

      - name: Keo RSS + phan loai
        id: run
        run: |
          cd market-data/news-rss
          if [ "${{ inputs.reclass }}" = "true" ]; then python fetch_rss.py --reclass; else python fetch_rss.py; fi

      - name: Day kho tin len Drive
        if: steps.run.outcome == 'success'
        run: rclone copy "$NEWS_DIR" "$RCLONE_REMOTE/market-data/news-rss/data" --transfers 8

      - name: Trang thai
        if: always()
        run: |
          echo "## News RSS" >> "$GITHUB_STEP_SUMMARY"
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY" || echo "(khong doc duoc ket qua)" >> "$GITHUB_STEP_SUMMARY"
          import os, pandas as pd
          d = os.environ["NEWS_DIR"]
          t = pd.read_parquet(os.path.join(d, "news_tagged.parquet"), columns=["ngay_gio", "nganh_chinh"])
          fs = pd.read_csv(os.path.join(d, "feed_status.csv"))
          print(f"- {len(t)} bai, moi nhat {t.ngay_gio.max()}, {(t.nganh_chinh != 'Chưa phân loại').mean() * 100:.1f}% co nganh")
          print(f"- feed loi: {int(fs['loi'].fillna('').ne('').sum())}/{len(fs)}")
          for r in fs[fs['loi'].fillna('').ne('')].itertuples():
              print(f"  - {r.nguon} / {r.chuyen_muc}: {r.loi}")
          EOF
